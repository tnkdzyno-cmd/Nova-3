<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>try{document.documentElement.setAttribute("data-theme", localStorage.getItem("nova_theme")||"light")}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suppliers (AP) — Nova</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail"></aside>
    <main>
      <div class="letterhead">
        <div><h1>Suppliers &amp; Payables</h1><div class="sub">Supplier invoices and payment runs</div></div>
      </div>

      <div id="alertHost"></div>

      <div class="panel">
        <div class="panel-row">
          <h2>Suppliers</h2>
          <button class="small" id="toggleAddSupplier">+ Add supplier</button>
        </div>
        <form id="supplierForm" style="display:none; margin-bottom:16px;">
          <div class="grid-2">
            <div class="field"><label>Name</label><input id="supName" required /></div>
            <div class="field"><label>Contact</label><input id="supContact" placeholder="email or phone" /></div>
          </div>
          <button type="submit">Add supplier</button>
        </form>
        <table class="ledger" id="suppliersTable">
          <thead><tr><th>Name</th><th>Contact</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-row"><h2>New supplier invoice</h2></div>
        <div class="grid-2">
          <div class="field"><label>Supplier</label><select id="apSupplier"></select></div>
          <div class="field"></div>
        </div>
        <div id="apLinesHost"></div>
        <button type="button" class="secondary small" id="apAddLine" style="margin-bottom:14px;">+ Add expense line</button>
        <div class="grid-2">
          <div class="field"><label>Invoice date</label><input id="apDate" type="date" /></div>
          <div class="field"><label>Due date</label><input id="apDue" type="date" /></div>
        </div>
        <button id="apSubmit">Capture invoice</button>
      </div>

      <div class="panel">
        <div class="panel-row">
          <h2>Supplier invoices</h2>
          <div style="display:flex; gap:8px;">
            <button class="secondary small" id="exportCsv">Export CSV</button>
            <button class="secondary small" id="exportPdf">Export PDF</button>
          </div>
        </div>

        <div class="grid-2" style="margin-bottom:10px;">
          <div class="field"><label>Search (ref no. or supplier)</label><input id="searchBox" placeholder="e.g. BILL-2026-0002 or ZESA" /></div>
          <div class="field">
            <label>Status</label>
            <select id="statusFilter"><option value="">All statuses</option><option value="open">Open</option><option value="partial">Partial</option><option value="paid">Paid</option></select>
          </div>
        </div>
        <div class="grid-2" style="margin-bottom:14px;">
          <div class="field"><label>From date</label><input id="dateFrom" type="date" /></div>
          <div class="field"><label>To date</label><input id="dateTo" type="date" /></div>
        </div>

        <table class="ledger" id="apInvoicesTable">
          <thead><tr><th>Ref No</th><th>Supplier</th><th>Date</th><th>Due</th><th class="num">Total</th><th class="num">Outstanding</th><th>Status</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="panel-row" style="margin-top:10px;">
          <div class="muted" id="resultCount"></div>
          <div id="pager"></div>
        </div>
      </div>

      <div class="panel" id="paySection" style="display:none;">
        <div class="panel-row"><h2>Record payment</h2></div>
        <div class="muted" id="payInvoiceLabel" style="margin-bottom:12px;"></div>
        <div class="grid-2">
          <div class="field"><label>Amount</label><input id="apPayAmount" placeholder="0.00" inputmode="decimal" /></div>
          <div class="field"><label>Method</label><select id="apPayMethod"><option value="bank">Bank</option><option value="cash">Cash</option></select></div>
        </div>
        <div class="grid-2">
          <div class="field"><label>Date</label><input id="apPayDate" type="date" /></div>
          <div class="field"><label>Reference</label><input id="apPayRef" placeholder="EFT no." /></div>
        </div>
        <div class="field" id="approverField" style="display:none;">
          <label>Second approver (required over the approval threshold)</label>
          <select id="apApprover"></select>
        </div>
        <div class="muted" id="thresholdNote" style="margin-bottom:10px;"></div>
        <button id="apPaySubmit">Release payment</button>
        <button class="secondary" id="apPayCancel" type="button">Cancel</button>
      </div>
    </main>
  </div>

  <script src="api.js"></script>
  <script>
    requireAuth();
    renderRail("suppliers.html");
    const alertHost = document.getElementById("alertHost");
    const me = getUser();
    let suppliers = [], expenseAccounts = [], apInvoices = [], staff = [], threshold = 50000, payingInvoiceId = null, currentPage = 1;

    function expenseOptions() {
      return expenseAccounts.map((a) => `<option value="${a.id}">${escapeHtml(a.code)} — ${escapeHtml(a.name)}</option>`).join("");
    }
    function apLineRow(host) {
      const row = document.createElement("div");
      row.style.display = "grid";
      row.style.gridTemplateColumns = "1.4fr 2fr 1fr auto";
      row.style.gap = "8px";
      row.style.marginBottom = "8px";
      row.innerHTML = `
        <select class="al-account">${expenseOptions()}</select>
        <input class="al-desc" placeholder="Description" />
        <input class="al-amount" placeholder="0.00" inputmode="decimal" />
        <button type="button" class="secondary small al-remove">✕</button>
      `;
      host.appendChild(row);
      row.querySelector(".al-remove").addEventListener("click", () => row.remove());
    }

    function renderSuppliers() {
      const body = document.querySelector("#suppliersTable tbody");
      body.innerHTML = suppliers.length
        ? suppliers.map((s) => `<tr><td>${escapeHtml(s.name)}</td><td class="muted">${escapeHtml(s.contact || "—")}</td></tr>`).join("")
        : `<tr><td colspan="2" class="empty">No suppliers yet.</td></tr>`;
      document.getElementById("apSupplier").innerHTML = suppliers.map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("");
    }

    function renderApInvoices(total, page, totalPages) {
      const body = document.querySelector("#apInvoicesTable tbody");
      body.innerHTML = apInvoices.length
        ? apInvoices
            .map((i) => {
              const supplier = suppliers.find((s) => s.id === i.supplierId);
              const outstanding = i.totalAmount - i.amountPaid;
              return `<tr>
                <td class="mono">${escapeHtml(i.refNo)}</td>
                <td>${escapeHtml(supplier?.name || "—")}</td>
                <td>${fmtDate(i.date)}</td>
                <td>${fmtDate(i.dueDate)}</td>
                <td class="num">${money(i.totalAmount)}</td>
                <td class="num">${money(outstanding)}</td>
                <td><span class="${pillClass(i.status)}">${i.status}</span></td>
                <td>${i.status !== "paid" ? `<button class="secondary small" data-pay="${i.id}">Pay</button>` : ""}</td>
              </tr>`;
            })
            .join("")
        : `<tr><td colspan="8" class="empty">No supplier invoices match this filter.</td></tr>`;

      document.getElementById("resultCount").textContent = `${total} invoice${total === 1 ? "" : "s"} matching`;
      renderPager(document.getElementById("pager"), { page, totalPages }, (p) => { currentPage = p; loadInvoices(); });
      body.querySelectorAll("[data-pay]").forEach((btn) => btn.addEventListener("click", () => startPayment(btn.dataset.pay)));
    }

    function startPayment(invoiceId) {
      payingInvoiceId = invoiceId;
      const invoice = apInvoices.find((i) => i.id === invoiceId);
      const supplier = suppliers.find((s) => s.id === invoice.supplierId);
      const outstanding = invoice.totalAmount - invoice.amountPaid;
      document.getElementById("payInvoiceLabel").textContent = `${supplier?.name || ""} (${invoice.refNo}) — outstanding ${money(outstanding)}`;
      document.getElementById("apPayAmount").value = (outstanding / 100).toFixed(2);
      document.getElementById("thresholdNote").textContent = `Payments over ${money(threshold)} require a second approver.`;
      document.getElementById("apApprover").innerHTML = staff
        .filter((u) => u.id !== me.id)
        .map((u) => `<option value="${u.id}">${escapeHtml(u.fullName)} (${u.role.replace("_", " ")})</option>`)
        .join("");
      document.getElementById("paySection").style.display = "block";
      document.getElementById("paySection").scrollIntoView({ behavior: "smooth" });
      toggleApproverField();
    }

    function toggleApproverField() {
      const amount = toCents(document.getElementById("apPayAmount").value || "0");
      document.getElementById("approverField").style.display = amount > threshold ? "block" : "none";
    }
    document.getElementById("apPayAmount").addEventListener("input", toggleApproverField);

    document.getElementById("apPayCancel").addEventListener("click", () => {
      payingInvoiceId = null;
      document.getElementById("paySection").style.display = "none";
    });

    document.getElementById("apPaySubmit").addEventListener("click", async () => {
      if (!payingInvoiceId) return;
      const amount = toCents(document.getElementById("apPayAmount").value || "0");
      const body = {
        invoiceId: payingInvoiceId,
        date: document.getElementById("apPayDate").value,
        amount,
        method: document.getElementById("apPayMethod").value,
        bankTxnRef: document.getElementById("apPayRef").value.trim() || undefined,
      };
      if (amount > threshold) body.approvedBy = document.getElementById("apApprover").value;
      try {
        await api("/api/suppliers/payments", { method: "POST", body });
        showAlert(alertHost, "Payment released.", "ok");
        document.getElementById("paySection").style.display = "none";
        payingInvoiceId = null;
        await loadInvoices();
      } catch (err) {
        showAlert(alertHost, err.message, "error");
      }
    });

    document.getElementById("toggleAddSupplier").addEventListener("click", () => {
      const f = document.getElementById("supplierForm");
      f.style.display = f.style.display === "none" ? "block" : "none";
    });
    document.getElementById("supplierForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await api("/api/suppliers", { method: "POST", body: { name: document.getElementById("supName").value.trim(), contact: document.getElementById("supContact").value.trim() } });
        e.target.reset();
        e.target.style.display = "none";
        await loadSuppliers();
      } catch (err) {
        showAlert(alertHost, err.message, "error");
      }
    });

    document.getElementById("apAddLine").addEventListener("click", () => apLineRow(document.getElementById("apLinesHost")));
    document.getElementById("apSubmit").addEventListener("click", async () => {
      const lines = [...document.getElementById("apLinesHost").children]
        .map((row) => ({ accountId: row.querySelector(".al-account").value, description: row.querySelector(".al-desc").value.trim() || "Expense", amount: toCents(row.querySelector(".al-amount").value || "0") }))
        .filter((l) => l.amount > 0);
      if (!lines.length) return showAlert(alertHost, "Add at least one expense line with an amount.", "error");
      try {
        await api("/api/suppliers/invoices", {
          method: "POST",
          body: { supplierId: document.getElementById("apSupplier").value, date: document.getElementById("apDate").value, dueDate: document.getElementById("apDue").value, lines },
        });
        document.getElementById("apLinesHost").innerHTML = "";
        apLineRow(document.getElementById("apLinesHost"));
        showAlert(alertHost, "Supplier invoice captured.", "ok");
        await loadInvoices();
      } catch (err) {
        showAlert(alertHost, err.message, "error");
      }
    });

    async function loadSuppliers() {
      const supRes = await api("/api/suppliers");
      suppliers = supRes.suppliers;
      renderSuppliers();
    }

    function currentFilters() {
      return {
        search: document.getElementById("searchBox").value.trim(),
        status: document.getElementById("statusFilter").value,
        dateFrom: document.getElementById("dateFrom").value,
        dateTo: document.getElementById("dateTo").value,
      };
    }

    async function loadInvoices() {
      const params = { ...currentFilters(), page: currentPage, pageSize: 10 };
      const apRes = await api("/api/suppliers/invoices", { params });
      apInvoices = apRes.invoices;
      threshold = apRes.approvalThresholdCents;
      renderApInvoices(apRes.total, apRes.page, apRes.totalPages);
    }

    let searchDebounce;
    function onFilterChange() {
      currentPage = 1;
      loadInvoices().catch((err) => showAlert(alertHost, err.message, "error"));
    }
    document.getElementById("searchBox").addEventListener("input", () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(onFilterChange, 300);
    });
    ["statusFilter", "dateFrom", "dateTo"].forEach((id) => document.getElementById(id).addEventListener("change", onFilterChange));

    function exportUrl(format) {
      const params = new URLSearchParams(Object.entries(currentFilters()).filter(([, v]) => v));
      params.set("format", format);
      return `/api/suppliers/invoices?${params.toString()}`;
    }
    document.getElementById("exportCsv").addEventListener("click", () =>
      downloadExport(exportUrl("csv"), "supplier-invoices.csv").catch((err) => showAlert(alertHost, err.message, "error"))
    );
    document.getElementById("exportPdf").addEventListener("click", () =>
      downloadExport(exportUrl("pdf"), "supplier-invoices.pdf").catch((err) => showAlert(alertHost, err.message, "error"))
    );

    (async function init() {
      const today = new Date().toISOString().slice(0, 10);
      ["apDate", "apDue", "apPayDate"].forEach((id) => (document.getElementById(id).value = today));
      try {
        const [accRes, usersRes] = await Promise.all([api("/api/accounts"), api("/api/users")]);
        expenseAccounts = accRes.accounts.filter((a) => a.type === "expense" && a.isActive);
        staff = usersRes.users;
        apLineRow(document.getElementById("apLinesHost"));
        await loadSuppliers();
        await loadInvoices();
      } catch (err) {
        showAlert(alertHost, err.message, "error");
      }
    })();
  </script>
</body>
</html>
